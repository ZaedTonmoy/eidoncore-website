<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Presentation styles</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap');

:root{--violet:#6c5dd3;--amber:#f0a93c;--ink:#12121a;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);}
section{position:relative;padding:90px 24px 100px;display:flex;flex-direction:column;align-items:center;overflow:hidden;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:34px;display:flex;align-items:center;gap:8px;position:relative;z-index:2;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;}
.stage-wrap{position:relative;width:100%;max-width:1040px;}

/* ===== 01 refined floating device, white ===== */
#s1{background:#ffffff;}
#s1 .eyebrow{color:#6b6d78;}
#s1 .eyebrow .dot{background:var(--violet);}
#s1 .stage-wrap{perspective:2200px;padding-bottom:60px;}
#s1 .device-outer{position:relative;z-index:2;margin:0 auto;border-radius:21px;padding:1.4px;background:linear-gradient(135deg,#e4e4e8 0%,#a5a6ad 50%,#e4e4e8 100%);box-shadow:0 24px 60px -18px rgba(18,18,26,0.22),0 44px 90px -30px rgba(18,18,26,0.14);transform:rotateX(9deg) rotateY(-13deg);transition:transform .15s ease-out;}
#s1 .device{position:relative;border-radius:19.5px;padding:9px;background:linear-gradient(155deg,#3c3c46 0%,#1d1d24 45%,#48484f 100%);}
#s1 .device::before{content:"";position:absolute;top:50%;left:6px;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:#6d6d78;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.25);}
#s1 .device::after{content:"";position:absolute;inset:9px;border-radius:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);pointer-events:none;}
#s1 .screen{position:relative;border-radius:12px;overflow:hidden;background:#0e1017;}
#s1 .screen img{display:block;width:100%;}
#s1 .glare{position:absolute;inset:0;background:linear-gradient(115deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 22%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.06) 100%);}
#s1 .reflect{position:absolute;top:100%;left:0;width:100%;margin-top:-8px;transform:rotateX(9deg) rotateY(-13deg) scaleY(-1);transform-origin:top center;opacity:0.16;-webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 65%);mask-image:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 65%);pointer-events:none;border-radius:20px;overflow:hidden;}
#s1 .reflect img{display:block;width:100%;}

/* ===== 02 dark spotlight (kept) ===== */
#s2{background:#0a0a10;}
#s2 .eyebrow{color:#8b8d9c;}
#s2 .eyebrow .dot{background:var(--amber);}
#s2 .spot{position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:900px;height:700px;background:radial-gradient(ellipse, rgba(108,93,211,0.22) 0%, rgba(108,93,211,0) 65%);pointer-events:none;}
#s2 .panel{position:relative;border-radius:16px;padding:1px;background:linear-gradient(140deg, rgba(124,111,240,0.7), rgba(240,169,60,0.35), rgba(124,111,240,0.1));box-shadow:0 40px 100px -30px rgba(0,0,0,0.65);}
#s2 .panel-inner{border-radius:15px;overflow:hidden;background:#0e1017;}
#s2 .panel-inner img{display:block;width:100%;}

/* ===== 03 white spotlight ===== */
#s3{background:#ffffff;padding-bottom:70px;}
#s3 .eyebrow{color:#6b6d78;}
#s3 .eyebrow .dot{background:var(--violet);}
#s3 .glow{position:absolute;width:780px;height:420px;left:50%;top:2%;transform:translateX(-50%);background:radial-gradient(ellipse, rgba(108,93,211,0.14) 0%, rgba(240,169,60,0.08) 45%, rgba(108,93,211,0) 72%);filter:blur(20px);}
#s3 .panel{position:relative;border-radius:18px;padding:2px;background:linear-gradient(115deg, #4E82EE 0%, #6F75EE 16%, #9B72CF 33%, #BA88E8 50%, #E84A5F 66%, #9C27B0 83%, #673AB7 100%);background-size:300% 300%;animation:borderflow 7s ease infinite;box-shadow:0 30px 70px -22px rgba(18,18,26,0.18),0 46px 100px -30px rgba(124,92,250,0.24);}
#s3 .panel-inner{border-radius:15px;overflow:hidden;background:#0e1017;}
@keyframes borderflow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
#s3 .panel-inner img{display:block;width:100%;}

/* ===== 04 moody macro tilt ===== */
#s5{background:radial-gradient(ellipse at 50% 0%, #1c1c26 0%, #08080c 68%);}
#s5 .eyebrow{color:#8b8d9c;}
#s5 .eyebrow .dot{background:#c25bd6;}
#s5 .stage-wrap{perspective:1000px;}
#s5 .bleed{position:absolute;left:14%;bottom:6%;width:60%;height:200px;background:radial-gradient(ellipse, rgba(155,80,220,0.35) 0%, rgba(155,80,220,0) 70%);filter:blur(30px);}
#s5 .device{position:relative;z-index:2;margin:0 auto;border-radius:18px;padding:8px;background:linear-gradient(155deg,#2a2a34 0%,#141419 50%,#242430 100%);box-shadow:0 50px 110px -20px rgba(0,0,0,0.7);transform:rotateX(20deg) rotateY(-26deg) rotate(1deg);}
#s5 .screen{position:relative;border-radius:11px;overflow:hidden;background:#0e1017;}
#s5 .screen img{display:block;width:100%;}
#s5 .glare{position:absolute;inset:0;background:linear-gradient(120deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 20%, rgba(255,255,255,0) 74%, rgba(180,110,255,0.10) 100%);}
#s5 .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.55) 100%);pointer-events:none;}

/* ===== 05 white macro tilt ===== */
#s6{background:radial-gradient(ellipse at 50% 0%, #ffffff 0%, #f2f1f6 68%);}
#s6 .eyebrow{color:#6b6d78;}
#s6 .eyebrow .dot{background:#c25bd6;}
#s6 .stage-wrap{perspective:1000px;}
#s6 .bleed{position:absolute;left:14%;bottom:6%;width:60%;height:200px;background:radial-gradient(ellipse, rgba(155,80,220,0.22) 0%, rgba(155,80,220,0) 70%);filter:blur(30px);}
#s6 .device-outer{position:relative;z-index:2;margin:0 auto;border-radius:19px;padding:1.4px;background:linear-gradient(135deg,#e4e4e8 0%,#a5a6ad 50%,#e4e4e8 100%);box-shadow:0 50px 110px -22px rgba(18,18,26,0.24),0 20px 50px -18px rgba(155,80,220,0.16);transform:rotateX(20deg) rotateY(-26deg) rotate(1deg);}
#s6 .device{position:relative;border-radius:17.5px;padding:8px;background:linear-gradient(155deg,#3c3c46 0%,#1d1d24 45%,#48484f 100%);}
#s6 .screen{position:relative;border-radius:11px;overflow:hidden;background:#0e1017;}
#s6 .screen img{display:block;width:100%;}
#s6 .glare{position:absolute;inset:0;background:linear-gradient(120deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 20%, rgba(255,255,255,0) 74%, rgba(180,110,255,0.06) 100%);}
#s6 .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(210,205,220,0.35) 100%);pointer-events:none;}

@media (max-width:760px){
  #s1 .device,#s5 .device{transform:none;}
  #s3 .device{transform:rotate(-1deg);}
  #s4 .card-wrap{margin-right:auto;}
  #s1 .reflect{display:none;}
}
</style>
</head>
<body>

<section id="s1">
  <div class="eyebrow"><span class="dot"></span>01 — floating device</div>
  <div class="stage-wrap">
    <div class="device-outer" id="dev1">
      <div class="device">
        <div class="screen"><img class="shot" alt="dashboard"><div class="glare"></div></div>
      </div>
    </div>
  </div>
</section>

<section id="s3">
  <div class="glow"></div>
  <div class="eyebrow"><span class="dot"></span>02 — white spotlight</div>
  <div class="stage-wrap">
    <div class="panel"><div class="panel-inner"><img class="shot" alt="dashboard"></div></div>
  </div>
</section>

<section id="s6">
  <div class="vignette"></div>
  <div class="eyebrow"><span class="dot"></span>03 — white macro tilt</div>
  <div class="stage-wrap">
    <div class="bleed"></div>
    <div class="device-outer">
      <div class="device">
        <div class="screen"><img class="shot" alt="dashboard"><div class="glare"></div></div>
      </div>
    </div>
  </div>
</section>

document.querySelectorAll('img.shot').forEach(el => el.src = IMG);

const wrap = document.getElementById('s1').querySelector('.stage-wrap');
const dev1 = document.getElementById('dev1');
wrap.addEventListener('mousemove', (e) => {
  const r = wrap.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - 0.5;
  const py = (e.clientY - r.top) / r.height - 0.5;
  dev1.style.transform = `rotateX(${9 - py * 8}deg) rotateY(${-13 + px * 12}deg)`;
});
wrap.addEventListener('mouseleave', () => {
  dev1.style.transform = 'rotateX(9deg) rotateY(-13deg)';
});
</script>
